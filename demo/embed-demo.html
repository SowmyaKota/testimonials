<!doctype html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Acme Corp - Customer Site (Widget Demo)</title>
  <style>
    body { font-family: Georgia, serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    header { border-bottom: 3px solid #222; padding-bottom: 16px; margin-bottom: 32px; }
    h1 { margin: 0; }
    .badge { display: inline-block; background: #fef3c7; color: #92400e; padding: 2px 8px;
             border-radius: 4px; font-size: 12px; font-family: sans-serif; margin-left: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Acme Corp <span class="badge">This is a plain HTML page, not our React app</span></h1>
    <p>We build widgets. Here's what our customers say:</p>
  </header>

  <div id="testimonial-widget"
       data-api="http://localhost:4000"
       data-accent="#b45309"></div>

  <script src="http://localhost:4000/widget/widget.js"></script>
</body>
</html>
